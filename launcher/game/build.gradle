plugins { id 'com.android.application' }

def releaseSecrets = new Properties()
def signingFile = rootProject.file('../phone/keys/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { releaseSecrets.load(it) }

android {
    namespace 'com.gentv.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.gentv.game.plugin'
        minSdk 28
        targetSdk 34
        versionCode 37
        versionName '3.7.15'
    }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }
    signingConfigs {
        production {
            if (!releaseSecrets.isEmpty()) {
                storeFile rootProject.file('../phone/keys/' + releaseSecrets.getProperty('storeFile'))
                storePassword releaseSecrets.getProperty('storePassword')
                keyAlias releaseSecrets.getProperty('keyAlias')
                keyPassword releaseSecrets.getProperty('keyPassword')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.production } }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly project(':game-api')
    implementation('org.mozilla.geckoview:geckoview:128.0.20240725162350') { transitive = false }
    implementation('org.mozilla.geckoview:geckoview-exoplayer2:128.0.20240725162350') { transitive = false }
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'com.google.zxing:core:3.3.3'
}
