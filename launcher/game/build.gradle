plugins { id 'com.android.library' }

android {
    namespace 'com.gentv.game'
    compileSdk 34
    defaultConfig { minSdk 23 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Universal GeckoView keeps TV and game in one APK across ARM variants.
    implementation('org.mozilla.geckoview:geckoview:128.0.20240725162350') {
        // WebAuthn/Google sign-in is unused by this keyboard-controlled game.
        exclude group: 'com.google.android.gms'
    }
    implementation 'com.google.zxing:core:3.3.3'
}
