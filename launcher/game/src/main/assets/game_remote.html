<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07101d"><title>GenTV 赛车遥控器</title>
<style>
:root{color-scheme:dark;--ink:#f4f8ff;--muted:#9aacc6;--mint:#a7ffcf;--cyan:#61d9f2}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font:16px system-ui,-apple-system,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 85% -10%,#19566a,transparent 42%),radial-gradient(ellipse at -10% 95%,#303960,transparent 42%),#07101d;user-select:none;-webkit-user-select:none}main{max-width:850px;margin:auto;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.eyebrow{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.17em}.eyebrow:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px var(--mint);margin-right:9px}h1{font-size:clamp(28px,6vw,43px);letter-spacing:-.04em;margin:10px 0 4px}.subtitle{margin:0 0 18px;color:var(--muted);font-size:14px}.connect{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 17px;border:1px solid #365571;border-radius:19px;background:linear-gradient(120deg,#182f45,#101d31);box-shadow:0 16px 35px #02071355}.connect label{font-weight:700}.connect small{display:block;color:var(--muted);font-size:12px;margin-top:3px}input{width:112px;height:48px;border:2px solid #527c96;border-radius:12px;background:#071522;color:white;text-align:center;font-size:24px;font-weight:800;letter-spacing:.2em;outline:none}input:focus{border-color:var(--mint);box-shadow:0 0 0 4px #a7ffcf25}.status{min-height:26px;margin:10px 3px 16px;color:var(--muted);font-size:13px}.status:before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#738ca5}.status.ok{color:var(--mint)}.status.ok:before{background:var(--mint);box-shadow:0 0 12px var(--mint)}.status.error{color:#ffacaa}.status.error:before{background:#ff7777}.deck{display:grid;grid-template-columns:1fr 1fr;gap:12px}.module{padding:14px;border:1px solid #304a66;border-radius:20px;background:linear-gradient(150deg,#172b42,#0c1b2f);box-shadow:inset 0 1px #ffffff12,0 14px 30px #0004}.module h2{margin:0 0 11px;font-size:12px;letter-spacing:.15em;color:#a4b8d2}.module h2 b{color:var(--cyan);margin-left:7px;letter-spacing:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{font:inherit;cursor:pointer;border:0;touch-action:none;-webkit-tap-highlight-color:transparent}.key{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-height:105px;border:1px solid #567896;border-bottom:4px solid #264461;border-radius:17px;background:linear-gradient(160deg,#2b4968,#192e4a);color:white;font-size:18px;font-weight:800;box-shadow:inset 0 1px #ffffff2a,0 8px 17px #0004;transition:transform .08s,background .08s}.key .symbol{font-size:29px;line-height:1}.key small{font-size:10px;letter-spacing:.13em;color:#aec6dc}.key.gas{background:linear-gradient(160deg,#b8ffe0,#43bf94);color:#063328;border-color:#bcffe2;border-bottom-color:#298968}.key.gas small{color:#22684e}.key.brake{background:linear-gradient(160deg,#536382,#334565)}.key.active,.key:active{transform:translateY(3px) scale(.985);border-bottom-width:1px;background:linear-gradient(160deg,#90f0ec,#45bad4);color:#082637;box-shadow:0 0 0 3px #76edee55,0 0 25px #54e7f566}.key:focus-visible{outline:3px solid var(--mint);outline-offset:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.actions .key{min-height:82px}.drift{background:linear-gradient(145deg,#695591,#3b315e);border-color:#8e77bc}.nitro{background:linear-gradient(145deg,#f9bd70,#b87538);border-color:#ffd59a;color:#281708}.utility{display:flex;gap:9px;margin-top:14px}.utility .key{min-height:44px;flex:1;border-radius:12px;font-size:13px;background:#16273b}.note{margin:15px 2px 0;color:#849ab7;font-size:12px;line-height:1.5}@media(max-width:560px){.deck{gap:8px}.module{padding:9px;border-radius:16px}.module h2{font-size:10px}.key{min-height:96px;font-size:15px;border-radius:14px}.key .symbol{font-size:25px}.connect{padding:11px}}@media(max-height:520px) and (orientation:landscape){main{padding-top:8px;padding-bottom:8px}.eyebrow,h1,.subtitle,.note{display:none}.connect{padding:6px 12px}.connect small{display:none}input{height:34px;font-size:19px}.status{margin:4px 2px;min-height:19px}.module{padding:7px}.module h2{margin-bottom:4px}.key{min-height:62px}.actions{margin-top:6px}.actions .key{min-height:48px}.utility{margin-top:6px}.utility .key{min-height:33px}}
.deck,.pair,.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.module,.key{min-width:0}.utility .key{overflow:hidden}</style></head><body><main><div class="eyebrow">GenTV · KART CONTROLLER</div><h1>掌心方向盘</h1><p class="subtitle">扫码会自动填入电视验证码，也可以手动输入。</p><section class="connect"><div><label for="code">连接电视</label><small>验证码显示在电视游戏画面上</small></div><input id="code" aria-label="电视验证码" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="one-time-code" placeholder="0000"></section><div id="status" class="status" role="status">按住任意控制键开始连接</div><div class="deck"><section class="module"><h2>方向控制 <b>STEER</b></h2><div class="pair"><button class="key" data-key="ArrowLeft"><span class="symbol">↶</span>向左<small>LEFT</small></button><button class="key" data-key="ArrowRight"><span class="symbol">↷</span>向右<small>RIGHT</small></button></div></section><section class="module"><h2>速度控制 <b>DRIVE</b></h2><div class="pair"><button class="key gas" data-key="ArrowUp"><span class="symbol">▲</span>加速<small>GAS</small></button><button class="key brake" data-key="ArrowDown"><span class="symbol">▼</span>刹车<small>BRAKE</small></button></div></section></div><div class="actions"><button class="key drift" data-key="Shift"><span class="symbol">↗</span>漂移<small>DRIFT · HOLD</small></button><button class="key nitro" data-key="Space"><span class="symbol">⚡</span>氮气 / 道具<small>NITRO · ITEM</small></button></div><div class="utility"><button class="key" data-key="Enter">确认 / 开始</button><button class="key" data-key="Escape">暂停</button><button class="key" data-key="r">回到赛道</button></div><p class="note">按住方向、油门、刹车或漂移可持续操作；松开即停止。</p></main><script>
const code=document.getElementById('code'),status=document.getElementById('status'),held=new Map();const saved=location.hash.match(/code=(\d{4})/);if(saved){code.value=saved[1];history.replaceState(null,'',location.pathname)}function message(text,kind){status.textContent=text;status.className='status '+kind}function send(key,down){if(!/^\d{4}$/.test(code.value)){message('请输入电视上的 4 位验证码','error');return}fetch('/key',{method:'POST',headers:{'Content-Type':'text/plain'},body:'code='+code.value+'&key='+key+'&down='+(down?1:0),cache:'no-store'}).then(r=>message(r.ok?'已连接 · 正在控制电视':r.status===403?'验证码错误或连接已关闭':'连接失败，请重试',r.ok?'ok':'error')).catch(()=>message('无法连接电视，请检查局域网','error'))}function release(el){const key=el.dataset.key;if(!held.has(key))return;clearInterval(held.get(key));held.delete(key);el.classList.remove('active');send(key,false)}document.querySelectorAll('.key').forEach(el=>{el.addEventListener('pointerdown',e=>{e.preventDefault();if(held.has(el.dataset.key))return;el.setPointerCapture(e.pointerId);el.classList.add('active');send(el.dataset.key,true);held.set(el.dataset.key,setInterval(()=>send(el.dataset.key,true),500))});['pointerup','pointercancel','lostpointercapture'].forEach(event=>el.addEventListener(event,()=>release(el)))});window.addEventListener('pagehide',()=>document.querySelectorAll('.key').forEach(release));
</script></body></html>
