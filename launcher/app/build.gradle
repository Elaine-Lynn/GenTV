plugins {
    id 'com.android.application'
}

def releaseSecrets = new Properties()
def signingFile = rootProject.file('../phone/keys/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { releaseSecrets.load(it) }
// GenTV-hosted updates, online wallpapers and statistics stay off unless its API base is configured:
// -PgentvApiBaseUrl=..., GENTV_API_BASE_URL, or apiBaseUrl in the private phone/keys/signing.properties.
def apiBaseUrl = (findProperty('gentvApiBaseUrl') ?: System.getenv('GENTV_API_BASE_URL') ?: releaseSecrets.getProperty('apiBaseUrl') ?: '').trim()
def updateFallbackUrl = 'https://raw.githubusercontent.com/Elaine-Lynn/GenTV/update-manifest/config.json'
// Umeng uses a separate optional AppKey and an independent on-TV consent switch.
def umengAppKey = (findProperty('gentvUmengAppKey') ?: System.getenv('GENTV_UMENG_APP_KEY') ?: releaseSecrets.getProperty('umengAppKey') ?: '').trim()
if (umengAppKey && !(umengAppKey ==~ /[0-9a-fA-F]{24}/)) {
    throw new GradleException('gentvUmengAppKey must be a 24-character hexadecimal AppKey')
}
if (apiBaseUrl && !(apiBaseUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?\/([A-Za-z0-9._~-]+\/)*/)) {
    throw new GradleException('gentvApiBaseUrl must be an https URL ending in /')
}

android {
    namespace 'com.gentv.tv'
    compileSdk 34
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.gentv.tv'
        minSdk 17
        multiDexEnabled true
        targetSdk 34
        versionCode 40
        versionName '3.7.18'
        testInstrumentationRunner 'com.gentv.tv.DesktopIntegration'
        buildConfigField 'boolean', 'CHILD_TIMER_TEST_MODE', 'false'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBaseUrl + '"'
        buildConfigField 'String', 'UPDATE_FALLBACK_URL', '"' + updateFallbackUrl + '"'
        buildConfigField 'String', 'UMENG_APP_KEY', '"' + umengAppKey + '"'
    }

    signingConfigs {
        production {
            if (!releaseSecrets.isEmpty()) {
                storeFile rootProject.file('../phone/keys/' + releaseSecrets.getProperty('storeFile'))
                storePassword releaseSecrets.getProperty('storePassword')
                keyAlias releaseSecrets.getProperty('keyAlias')
                keyPassword releaseSecrets.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.production
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core:1.7.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // The legacy ExoPlayer line supports API 17; Media3's current video minimum is API 23.
    // Only core is needed for silent local MP4 wallpapers (no UI or streaming modules).
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    // 3.3.x is the last ZXing line compatible with the launcher's API 17 minimum.
    implementation 'com.google.zxing:core:3.3.3'
    implementation 'com.umeng.umsdk:common:10.0.1'
    implementation 'com.umeng.umsdk:asms:1.8.7.2'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}

// A release must never silently fall back to an Android debug certificate.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') && (it.name.startsWith('package') || it.name.startsWith('validateSigning')) } && releaseSecrets.isEmpty()) {
        throw new GradleException('Formal signing is missing: provision phone/keys/signing.properties securely.')
    }
}

tasks.register('releaseCertificateSha256') {
    doLast {
        if (releaseSecrets.isEmpty()) throw new GradleException('Formal signing is missing')
        def store = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
        def file = rootProject.file('../phone/keys/' + releaseSecrets.getProperty('storeFile'))
        file.withInputStream { store.load(it, releaseSecrets.getProperty('storePassword').toCharArray()) }
        def certificate = store.getCertificate(releaseSecrets.getProperty('keyAlias'))
        if (certificate == null || certificate.subjectX500Principal.name.contains('Android Debug')) {
            throw new GradleException('A formal certificate is required')
        }
        println 'GENTV_RELEASE_CERT=' + java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
    }
}
tasks.configureEach {
    if (name == 'validateSigningRelease') dependsOn('releaseCertificateSha256')
}

// Standalone TV redistribution includes the complete applicable notices next to the APK.
// The phone distribution also includes these texts in its own assets/licenses/.
def prepareReleaseNotices = tasks.register('prepareReleaseNotices', Sync) {
    from(rootProject.file('../LICENSE'))
    from(rootProject.file('../licenses/Outfit-OFL.txt'))
    from(rootProject.file('../licenses/Apache-2.0.txt'))
    from(rootProject.file('../licenses/TV-NOTICE.txt'))
    from(rootProject.file('../licenses/aerial-tv-MIT.txt'))
    from(rootProject.file('../licenses/ChinaGeoJson-MIT.txt'))
    into(layout.buildDirectory.dir('outputs/licenses/release'))
}
def packageReleaseDistribution = tasks.register('packageReleaseDistribution', Zip) {
    dependsOn('packageRelease', prepareReleaseNotices)
    from(layout.buildDirectory.file('outputs/apk/release/app-release.apk'))
    from(layout.buildDirectory.dir('outputs/licenses/release')) { into('licenses') }
    archiveFileName = 'GenTV-TV-release.zip'
    destinationDirectory = layout.buildDirectory.dir('outputs/distribution')
}
tasks.matching { it.name == 'assembleRelease' }.configureEach { finalizedBy(packageReleaseDistribution) }

// v3.7.12 rejects downloaded updates larger than 8 MiB. Keep this bridge
// release within its existing updater's limit until older clients have moved on.
def verifyLegacyUpdateSize = tasks.register('verifyLegacyUpdateSize') {
    dependsOn('packageRelease')
    doLast {
        def apk = layout.buildDirectory.file('outputs/apk/release/app-release.apk').get().asFile
        def limit = 8L * 1024 * 1024
        if (apk.length() > limit) {
            throw new GradleException("TV release APK is ${apk.length()} bytes; v3.7.12 accepts at most ${limit} bytes")
        }
        println "TV release APK fits v3.7.12 updater: ${apk.length()} / ${limit} bytes"
    }
}
tasks.matching { it.name == 'assembleRelease' }.configureEach { finalizedBy(verifyLegacyUpdateSize) }

// One routing catalog is shared by standalone TV APKs and the phone installer.
def prepareInputProfiles = tasks.register('prepareInputProfiles', Copy) {
    from(rootProject.file('../phone/framework/data/source-profiles.json'))
    into(layout.buildDirectory.dir('generated/inputProfiles'))
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/inputProfiles'))
tasks.named('preBuild') { dependsOn(prepareInputProfiles) }
