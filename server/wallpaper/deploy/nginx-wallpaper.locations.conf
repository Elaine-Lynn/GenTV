include /etc/nginx/snippets/gentv-trusted-proxies.conf;
# Include inside the selected HTTPS virtual host; existing website locations stay intact.
location = /tv/wallpaper {
    limit_except GET HEAD { deny all; }
    proxy_set_header X-GenTV-Peer $remote_addr;
    proxy_pass http://127.0.0.1:18765;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /tv/wallpapers/ {
    alias /srv/gentv/wallpaper/media/;
    autoindex off;
    disable_symlinks on;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff;
}

location = /tv/update {
    limit_except GET HEAD { deny all; }
    proxy_set_header X-GenTV-Peer $remote_addr;
    proxy_pass http://127.0.0.1:18765;
}
location = /tv/stats {
    limit_req zone=gentv_ingest burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    limit_except POST { deny all; }
    proxy_set_header X-GenTV-Peer $remote_addr;
    proxy_pass http://127.0.0.1:18765;
    access_log off;
}
location /tv/releases/ {
    alias /var/lib/gentv-tv/releases/;
    autoindex off;
    disable_symlinks on;
    limit_except GET HEAD { deny all; }
    types { application/vnd.android.package-archive apk; }
    add_header X-Content-Type-Options nosniff;
}

location = /tv/events {
    limit_req zone=gentv_ingest burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    limit_except POST { deny all; }
    proxy_set_header X-GenTV-Peer $remote_addr;
    proxy_pass http://127.0.0.1:18765;
    access_log off;
}
location = /tv/feedback {
    limit_req zone=gentv_ingest burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 2m;
    limit_except POST { deny all; }
    proxy_set_header X-GenTV-Peer $remote_addr;
    proxy_pass http://127.0.0.1:18765;
    access_log off;
}
