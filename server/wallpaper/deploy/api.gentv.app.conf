server {
    listen 80;
    listen [::]:80;
    server_name api.gentv.app;
    location ^~ /.well-known/acme-challenge/ { root /var/www/gentv/acme; try_files $uri =404; }
    location / { return 301 https://api.gentv.app$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.gentv.app;
    ssl_certificate /etc/letsencrypt/live/api.gentv.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gentv.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/gentv-tv-api.locations.conf;
    location / { return 404; }
}
