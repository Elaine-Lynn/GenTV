name: GenTV skill release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'phone/tv-care/**'
      - 'phone/framework/core/**'
      - 'skills/gentv-tv-care/**'
      - 'tools/*tv*'
      - '.github/workflows/tv-care-release.yml'
  push:
    tags: ['gentv-tv-care-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Statically link Intel macOS OpenSSL to avoid Python library collisions
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: python -m pip install --require-hashes -r tools/requirements-tv-transport.txt
      - run: python -m pip install -r tools/requirements-tv-build.txt
      - name: Test and package
        shell: bash
        run: |
          python -m unittest discover -s tools -p 'test_tv_*.py'
          ./phone/gradlew -p phone --no-daemon :tv-care:test :core:test
          python tools/package_tv_skill.py --frozen
      - name: Smoke test frozen entries
        shell: bash
        run: |
          python tools/test_tv_bundle.py --release phone/tv-care/build/skill-release/1.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: tv-care-${{ matrix.os }}
          path: |
            phone/tv-care/build/skill-release/1.0.0/*.zip
          if-no-files-found: error
  assemble:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: tv-care-*
          path: artifacts
      - run: python tools/assemble_tv_release.py --artifacts artifacts --output release
      - uses: actions/upload-artifact@v4
        with:
          name: gentv-tv-care-release
          path: release/
  draft:
    if: startsWith(github.ref, 'refs/tags/gentv-tv-care-v')
    needs: assemble
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gentv-tv-care-release
          path: release
      - name: Create reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --title "GenTV 电视管家 $RELEASE_TAG" --notes "多平台维护包及 Skill。发布前检查实机验收和校验清单；商店收录单独确认。"
