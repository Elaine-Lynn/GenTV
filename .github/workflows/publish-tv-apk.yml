name: Publish signed TV APK

on:
  push:
    tags: ['v3.7.18']
    branches: ['feature/3.7.18']

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Elaine-Lynn/GenTV'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v3.7.18
    steps:
      - uses: actions/checkout@v4
      - name: Match published metadata to the immutable tag
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/tags/v3.7.18:refs/tags/v3.7.18
          git diff --exit-code v3.7.18 -- docs/releases/v3.7.18 docs/release-notes-v3.7.18.md
      - name: Verify release metadata and download signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          source_dir="docs/releases/${RELEASE_TAG}"
          python3 - "$source_dir" "$version" <<'PY'
          import json, pathlib, sys
          folder, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          primary = json.loads((folder / 'config.json').read_text())
          backup = json.loads((folder / 'github-config.json').read_text())
          assert primary['versionName'] == backup['versionName'] == version
          assert primary['versionCode'] == backup['versionCode'] == 40
          assert primary['packageName'] == backup['packageName'] == 'com.gentv.tv'
          assert primary['sha256'] == backup['sha256']
          assert primary['sizeBytes'] == backup['sizeBytes']
          assert primary['signingCertificateSha256'] == backup['signingCertificateSha256'] == '8d5b5378f9056880f3036d44bc2f4a48322141fbb8d8bc91951d61a4652d997f'
          assert primary['url'] == f'https://api.gentv.app/tv/releases/gentv-tv-{version}.apk'
          assert backup['url'] == f'https://github.com/Elaine-Lynn/GenTV/releases/download/v{version}/gentv-tv-v{version}-code40.apk'
          PY
          apk_name="gentv-tv-v${version}-code40.apk"
          zip_name="gentv-tv-v${version}-code40-licenses.zip"
          base_url="https://api.gentv.app/tv/releases"
          mkdir -p release
          cp "$source_dir/github-config.json" release/config.json
          cp "$source_dir/SHA256SUMS.txt" release/SHA256SUMS.txt
          curl --fail --location --retry 3 --max-time 120 "$base_url/gentv-tv-${version}.apk" --output "release/$apk_name"
          curl --fail --location --retry 3 --max-time 120 "$base_url/$zip_name" --output "release/$zip_name"
          (cd release && sha256sum --check SHA256SUMS.txt)
      - name: Create or resume draft release with verified files
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state.txt 2>/dev/null; then
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "GenTV TV $RELEASE_TAG" \
              --notes-file "docs/release-notes-$RELEASE_TAG.md"
            printf 'true\n' > draft-state.txt
          fi
          if test "$(cat draft-state.txt)" != true; then
            echo '::error::The release is already public; refusing to change its assets.'
            exit 1
          fi
      - name: Verify or upload each release file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded
          for file in release/*; do
            name="${file##*/}"
            echo "::notice::Checking $name"
            if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.assets[].name' | grep -Fxq "$name"; then
              if ! gh release download "$RELEASE_TAG" --pattern "$name" --dir downloaded; then
                echo "::error::Could not download existing release asset $name"
                exit 1
              fi
            else
              if ! gh release upload "$RELEASE_TAG" "$file"; then
                echo "::error::Could not upload release asset $name"
                exit 1
              fi
              if ! gh release download "$RELEASE_TAG" --pattern "$name" --dir downloaded; then
                echo "::error::Could not download newly uploaded release asset $name"
                exit 1
              fi
            fi
            if ! cmp "$file" "downloaded/$name"; then
              echo "::error::Release asset differs from the verified file: $name"
              exit 1
            fi
          done
      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest
