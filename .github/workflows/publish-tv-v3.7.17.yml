name: Publish GenTV TV v3.7.17

on:
  push:
    branches:
      - feature/v3.7.17
    paths:
      - .github/workflows/publish-tv-v3.7.17.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Elaine-Lynn/GenTV'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.7.17
      - name: Check pinned release source
        run: test "$(git rev-parse HEAD)" = b3b19bd47bda94857a860d617704e7361ad382ce
      - name: Download and verify signed release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp docs/releases/v3.7.17/config.json release/config.json
          curl --fail --location --retry 3 --output release/gentv-tv-v3.7.17-code39.apk \
            https://api.gentv.app/tv/releases/gentv-tv-3.7.17.apk
          curl --fail --location --retry 3 --output release/gentv-tv-v3.7.17-code39-licenses.zip \
            https://api.gentv.app/tv/releases/gentv-tv-v3.7.17-code39-licenses.zip
          printf '%s  %s\n' deef0ef69cb7e23d92f33f743b59060ba3065a6526fe90ef2f679d83cb3aeb37 release/gentv-tv-v3.7.17-code39.apk | sha256sum --check
          printf '%s  %s\n' 64323b85bae32253311b40c96ddfafd614d751a1b6ae3f3f19d2676fe3b5f68e release/gentv-tv-v3.7.17-code39-licenses.zip | sha256sum --check
          unzip -p release/gentv-tv-v3.7.17-code39-licenses.zip app-release.apk | sha256sum | grep -F deef0ef69cb7e23d92f33f743b59060ba3065a6526fe90ef2f679d83cb3aeb37
          (cd release && sha256sum config.json gentv-tv-v3.7.17-code39-licenses.zip gentv-tv-v3.7.17-code39.apk > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      - name: Create draft Release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.7.17 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its assets' >&2
            exit 1
          fi
          gh release create v3.7.17 release/* --draft \
            --target b3b19bd47bda94857a860d617704e7361ad382ce \
            --title 'GenTV TV v3.7.17' \
            --notes-file docs/release-notes-v3.7.17.md
      - name: Verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download v3.7.17 --dir downloaded
          (cd downloaded && sha256sum --check SHA256SUMS.txt)
          gh release edit v3.7.17 --draft=false
